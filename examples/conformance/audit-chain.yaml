case: audit_chain
guarantee: audit-chain
title: "Editing, reordering, or deleting an audit entry is detected at the first broken link"
# README claim: "Hash-chained audit — tamper-evident, verifiable."
# Note the honest limit this does NOT claim: a full rewrite can regenerate a
# valid chain. What the chain detects is a partial edit, which is what an
# attacker with file access to one line actually does.

files:
  a: |
    scope: N
    source: run-a
    date: 2026-07-03
    declare: {entity: [{name: Acme Robotics}]}
    nodes:
      insight:
        - tag: one
          category: signal.new_hire
          statement: "First."
          entities: [Acme Robotics]
          evidence_strength: 3
  b: |
    scope: N
    source: run-b
    date: 2026-07-04
    declare: {entity: [{name: Beta Inc}]}
    nodes:
      insight:
        - tag: two
          category: signal.org_change
          statement: "Second."
          entities: [Beta Inc]
          evidence_strength: 3
  c: |
    scope: N
    source: run-c
    date: 2026-07-05
    declare: {entity: [{name: Gamma LLC}]}
    nodes:
      insight:
        - tag: three
          category: signal.org_change
          statement: "Third."
          entities: [Gamma LLC]
          evidence_strength: 3

steps:
  - ingest: {file: a, apply: true}
  - ingest: {file: b, apply: true}
  - ingest: {file: c, apply: true}
  - verify_audit:
    expect: {ok: true, reason_contains: "chain intact"}

  # Edit one payload in place. Every subsequent link breaks, and verify reports
  # the FIRST break rather than the last.
  - tamper: {how: edit_payload, line: 2}
  - verify_audit:
    expect: {ok: false, broken_at: 2, reason_contains: "payload edited after write"}
