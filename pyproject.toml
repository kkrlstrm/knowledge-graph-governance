[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph-governance"
version = "0.2.0"
description = "The deterministic write gate for agent-managed knowledge graphs. Let LLMs propose graph updates; only validated, versioned, provenance-stamped writes reach the graph."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Kai Karlstrom" }]
keywords = ["knowledge-graph", "ai-agents", "agent-memory", "llm", "graphrag",
            "write-gate", "controlled-vocabulary", "provenance", "audit", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/kkrlstrm/knowledge-graph-governance"
Source = "https://github.com/kkrlstrm/knowledge-graph-governance"
Issues = "https://github.com/kkrlstrm/knowledge-graph-governance/issues"

[project.scripts]
kgg = "kgg.cli:main"

[tool.setuptools.packages.find]
include = ["kgg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
