name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  conformance:
    # The documented guarantees, run as executable refusals. This is separate
    # from the unit tests on purpose: a failure here means a CLAIM in the README
    # stopped holding, which is a different kind of breakage from a regression in
    # an internal helper, and it should be readable as such in the checks list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate the shipped governance contract
        run: kgg validate-schema --schema examples/gtm/schema.yaml
      - name: Run the conformance suite
        run: kgg conformance --verbose
      - name: Publish the guarantee table
        if: always()
        run: |
          {
            echo "## Conformance"
            echo
            kgg conformance --markdown || true
          } >> "$GITHUB_STEP_SUMMARY"
